          path: C:\goanna-build\Projects\eMail\obj-x86_64-email-pc-mingw32\dist\eMail-*.win64.portable.7z
          archive: false

      - name: Build eMail Win32
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
