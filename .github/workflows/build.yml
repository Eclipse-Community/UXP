name: CI

on:
  push:
    branches: [ custom ]
  pull_request:
    branches: [ custom ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.product }} ${{ matrix.arch }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - product: lun3r
            arch: win64
            shell: amd64
            project: UXP
            mozconfig: C:/goanna-build/Projects/UXP/mozconfigs/lun3r-win64
            objdir: obj-x86_64-lun3r-pc-mingw32
            installer: lun3r-*.win64.installer.exe
            portable: lun3r-*.win64.portable.7z
            prepare_email: false

          - product: lun3r
            arch: win32
            shell: i386
            project: UXP
            mozconfig: C:/goanna-build/Projects/UXP/mozconfigs/lun3r-win32
            objdir: obj-i686-lun3r-pc-mingw32
            installer: lun3r-*.win32.installer.exe
            portable: lun3r-*.win32.portable.7z
            prepare_email: false

          - product: lun3r
            arch: ia32
            shell: i386
            project: UXP
            mozconfig: C:/goanna-build/Projects/UXP/mozconfigs/lun3r-ia32
            objdir: obj-ia32-lun3r-pc-mingw32
            installer: lun3r-*.ia32.installer.exe
            portable: lun3r-*.ia32.portable.7z
            prepare_email: false

          - product: hydra
            arch: win64
            shell: amd64
            project: UXP
            mozconfig: C:/goanna-build/Projects/UXP/mozconfigs/hydra-win64
            objdir: obj-x86_64-hydra-pc-mingw32
            installer: hydra-*.win64.installer.exe
            portable: hydra-*.win64.portable.7z
            prepare_email: false

          - product: hydra
            arch: win32
            shell: i386
            project: UXP
            mozconfig: C:/goanna-build/Projects/UXP/mozconfigs/hydra-win32
            objdir: obj-i686-hydra-pc-mingw32
            installer: hydra-*.win32.installer.exe
            portable: hydra-*.win32.portable.7z
            prepare_email: false

          - product: hydra
            arch: ia32
            shell: i386
            project: UXP
            mozconfig: C:/goanna-build/Projects/UXP/mozconfigs/hydra-ia32
            objdir: obj-ia32-hydra-pc-mingw32
            installer: hydra-*.ia32.installer.exe
            portable: hydra-*.ia32.portable.7z
            prepare_email: false

          - product: email
            arch: win64
            shell: amd64
            project: eMail
            mozconfig: C:/goanna-build/Projects/eMail/mozconfigs/email-win64
            objdir: obj-x86_64-email-pc-mingw32
            installer: eMail-*.win64.installer.exe
            portable: eMail-*.win64.portable.7z
            prepare_email: true

          - product: email
            arch: win32
            shell: i386
            project: eMail
            mozconfig: C:/goanna-build/Projects/eMail/mozconfigs/email-win32
            objdir: obj-i686-email-pc-mingw32
            installer: eMail-*.win32.installer.exe
            portable: eMail-*.win32.portable.7z
            prepare_email: true

          - product: email
            arch: ia32
            shell: i386
            project: eMail
            mozconfig: C:/goanna-build/Projects/eMail/mozconfigs/email-ia32
            objdir: obj-ia32-email-pc-mingw32
            installer: eMail-*.ia32.installer.exe
            portable: eMail-*.ia32.portable.7z
            prepare_email: true

          - product: lun3r-navigator
            arch: win64
            shell: amd64
            project: eMail
            mozconfig: C:/goanna-build/Projects/eMail/mozconfigs/lun3rnav-win64
            objdir: obj-x86_64-lun3rnav-pc-mingw32
            installer: lun3r-navigator-*.win64.installer.exe
            portable: lun3r-navigator-*.win64.portable.7z
            prepare_email: true

          - product: lun3r-navigator
            arch: win32
            shell: i386
            project: eMail
            mozconfig: C:/goanna-build/Projects/eMail/mozconfigs/lun3rnav-win32
            objdir: obj-i686-lun3rnav-pc-mingw32
            installer: lun3r-navigator-*.win32.installer.exe
            portable: lun3r-navigator-*.win32.portable.7z
            prepare_email: true

          - product: lun3r-navigator
            arch: ia32
            shell: i386
            project: eMail
            mozconfig: C:/goanna-build/Projects/eMail/mozconfigs/lun3rnav-ia32
            objdir: obj-ia32-lun3rnav-pc-mingw32
            installer: lun3r-navigator-*.ia32.installer.exe
            portable: lun3r-navigator-*.ia32.portable.7z
            prepare_email: true

    steps:
      - name: Download Goanna-Build
        shell: cmd
        run: curl -Lo goanna-build.7z https://github.com/teknixstuff/misc-files/releases/download/goanna-build/goanna-build.7z

      - name: Extract Goanna-Build
        shell: cmd
        run: |
          7z x -oC:\goanna-build goanna-build.7z
          del goanna-build.7z

      - name: Checkout UXP
        shell: cmd
        run: |
          git config --global core.autocrlf false
          git config --global core.eof lf
          md C:\goanna-build\Projects\UXP
          cd /d C:\goanna-build\Projects\UXP
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 --no-tags --prune --progress --no-recurse-submodules origin ${{ github.sha }}
          git checkout --force FETCH_HEAD

      - name: Prepare eMail project
        if: ${{ matrix.prepare_email }}
        shell: cmd
        run: |
          cd /d C:\goanna-build\Projects\UXP
          git apply 0001-platform.patch
          md C:\goanna-build\Projects\eMail
          cd /d C:\goanna-build\Projects\eMail
          git init
          git remote add origin https://github.com/Eclipse-Community/eMail.git
          git fetch --depth=1 --no-tags --prune --progress --no-recurse-submodules origin custom
          git checkout --force FETCH_HEAD
          mklink /d platform ..\UXP

      - name: Build
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
          call C:\goanna-build\shell-${{ matrix.shell }}.bat /NOTTY
          set "MOZCONFIG=${{ matrix.mozconfig }}"
          %MOZILLABUILD%msys\bin\bash --login -c "cd /c/goanna-build/Projects/${{ matrix.project }} && ./mach build && ./mach package && ./mach installer"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.product }}-${{ matrix.arch }}-installer
          path: C:\goanna-build\Projects\${{ matrix.project }}\${{ matrix.objdir }}\dist\${{ matrix.installer }}
          archive: false
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.product }}-${{ matrix.arch }}-portable
          path: C:\goanna-build\Projects\${{ matrix.project }}\${{ matrix.objdir }}\dist\${{ matrix.portable }}
          archive: false
          if-no-files-found: error
