          %MOZILLABUILD%msys\bin\bash --login -c "cd /c/goanna-build/Projects/eMail && ./mach build && ./mach package && ./mach installer"

      - name: Upload Win32 installer
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\eMail\obj-i686-email-pc-mingw32\dist\eMail-*.win32.installer.exe
          archive: false

      - name: Upload Win32 portable
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\eMail\obj-i686-email-pc-mingw32\dist\eMail-*.win32.portable.7z
          archive: false

      - name: Build eMail IA-32
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
          call C:\goanna-build\shell-i386.bat /NOTTY
