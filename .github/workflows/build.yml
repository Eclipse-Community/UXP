name: CI

on:
  push:
    branches: [ custom ]
  pull_request:
    branches: [ custom ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download Goanna-Build
        shell: cmd
        run: curl -Lo goanna-build.7z https://github.com/teknixstuff/misc-files/releases/download/goanna-build/goanna-build.7z

      - name: Extract Goanna-Build
        shell: cmd
        run: |
          7z x -oC:\goanna-build goanna-build.7z
          del goanna-build.7z

      - name: Checkout
        shell: cmd
        run: |
          git config --global core.autocrlf false
          git config --global core.eof lf
          md C:\goanna-build\Projects\UXP
          cd /d C:\goanna-build\Projects\UXP
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 --no-tags --prune --progress --no-recurse-submodules origin ${{ github.sha }}
          git checkout --force FETCH_HEAD

      - name: Build Lun3r Win64
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
          call C:\goanna-build\shell-amd64.bat /NOTTY
          set "MOZCONFIG=C:/goanna-build/Projects/UXP/mozconfigs/lun3r-win64"
          %MOZILLABUILD%msys\bin\bash --login -c "cd /c/goanna-build/Projects/UXP && ./mach build && ./mach package && ./mach installer"

      - name: Upload Win64 installer
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\UXP\obj-x86_64-lun3r-pc-mingw32\dist\lun3r-*.win64.installer.exe
          archive: false

      - name: Upload Win64 portable
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\UXP\obj-x86_64-lun3r-pc-mingw32\dist\lun3r-*.win64.portable.7z
          archive: false

      - name: Build Lun3r Win32
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
          call C:\goanna-build\shell-i386.bat /NOTTY
          set "MOZCONFIG=C:/goanna-build/Projects/UXP/mozconfigs/lun3r-win32"
          %MOZILLABUILD%msys\bin\bash --login -c "cd /c/goanna-build/Projects/UXP && ./mach build && ./mach package && ./mach installer"

      - name: Upload Win32 installer
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\UXP\obj-i686-lun3r-pc-mingw32\dist\lun3r-*.win32.installer.exe
          archive: false

      - name: Upload Win32 portable
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\UXP\obj-i686-lun3r-pc-mingw32\dist\lun3r-*.win32.portable.7z
          archive: false

      - name: Build Lun3r IA-32
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
          call C:\goanna-build\shell-i386.bat /NOTTY
          set "MOZCONFIG=C:/goanna-build/Projects/UXP/mozconfigs/lun3r-ia32"
          %MOZILLABUILD%msys\bin\bash --login -c "cd /c/goanna-build/Projects/UXP && ./mach build && ./mach package && ./mach installer"

      - name: Upload IA-32 installer
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\UXP\obj-ia32-lun3r-pc-mingw32\dist\lun3r-*.ia32.installer.exe
          archive: false

      - name: Upload IA-32 portable
        uses: actions/upload-artifact@v7
        with:
          path: C:\goanna-build\Projects\UXP\obj-ia32-lun3r-pc-mingw32\dist\lun3r-*.ia32.portable.7z
          archive: false

      - name: Build Hydra Win64
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;"
          call C:\goanna-build\shell-amd64.bat /NOTTY
          set "MOZCONFIG=C:/goanna-build/Projects/UXP/mozconfigs/hydra-win64"
          %MOZILLABUILD%msys\bin\bash --login -c "cd /c/goanna-build/Projects/UXP && ./mach build && ./mach package && ./mach installer"

